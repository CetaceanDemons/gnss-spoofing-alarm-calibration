[GNSS-SDR]
GNSS-SDR.internal_fs_sps=25000000
GNSS-SDR.internal_data_type=gr_complex
GNSS-SDR.generate_home_directory=true

;######### SIGNAL_SOURCE ############
SignalSource.implementation=File_Signal_Source
SignalSource.filename=/mnt/hgfs/Database/TEXBAT/cleanStatic.bin
SignalSource.item_type=ishort
SignalSource.sampling_frequency=25000000

;######### SIGNAL_CONDITIONER ############
SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Ishort_To_Complex
InputFilter.implementation=Pass_Through
Resampler.implementation=Pass_Through

;######### CHANNELS ############
Channels_1C.count=8
; 暂时注释掉固定卫星行，由脚本在运行期间动态注入
;Channel0.satellite=3
;Channel1.satellite=23

;######### ACQUISITION & TRACKING ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
; 【核心微调】：将阈值从 0.015 稍微下调至 0.008，防止跨越频点时的信噪比衰减导致漏检
Acquisition_1C.threshold=0.012
; 【核心破局】：打破默认的 +/- 5000Hz 盲区，将多普勒搜索域扩大一倍
Acquisition_1C.doppler_max=10000
Acquisition_1C.doppler_min=-10000
Acquisition_1C.doppler_step=250

Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.n_correlator_taps=21
Tracking_1C.carrier_lock_th=0.5
Tracking_1C.pll_bw_hz=15.0
Tracking_1C.dll_bw_hz=1.0
Tracking_1C.dump=true
Tracking_1C.dump_filename=/home/thegreatwzr/gnss-sdr/processed_Mao_TEXBAT/temp_dump/trk_ch_

;######### NAV & PVT ############
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
Observables.implementation=Hybrid_Observables
PVT.implementation=RTKLIB_PVT
